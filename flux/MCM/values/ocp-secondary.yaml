# Cluster values for the secondary, shared by all of its stages.
# The primary's URL travels inside the join token; this cluster's own URL is
# read from its Kasten Route at deploy time.
global:
  kastenMc:
    role: secondary

handoff:
  join:
    clusterName: ocp-secondary

k10:
  # Private or self-signed ingress certificates: create the ConfigMap first
  # (docs/runbook.md), then uncomment.
  cacertconfigmap:
    name: kasten-mc-ca-bundle
  # Accept the Kasten EULA at install time.
  eula:
    accept: true
    company: kasten
    email: test@example.com
