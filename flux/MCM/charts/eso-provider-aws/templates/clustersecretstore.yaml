{{- $primary := eq .Values.global.kastenMc.role "primary" }}
# Primary: the writer store. Secondary: the reader store.
# The store can be Ready with wrong IAM permissions. The first push or pull
# shows the real result.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ ternary "kasten-mc-writer" "kasten-mc-reader" $primary }}
  labels:
    app.kubernetes.io/part-of: kasten-multicluster
spec:
  conditions:
    - namespaces:
        - {{ ternary "kasten-io-mc" "kasten-io" $primary }}
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region | quote }}
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: {{ .Values.credentials.name }}
            namespace: {{ .Values.credentials.namespace }}
            key: access-key-id
          secretAccessKeySecretRef:
            name: {{ .Values.credentials.name }}
            namespace: {{ .Values.credentials.namespace }}
            key: secret-access-key
