---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kasten
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Veeam Kasten and its Multi-Cluster Manager supporting components
  sourceRepos:
    - https://github.com/chkpwd/kasten-gitops.git
    - https://charts.kasten.io/
    - https://charts.external-secrets.io
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
