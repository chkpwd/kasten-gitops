---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aks-primary
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: kasten
  source:
    repoURL: https://github.com/chkpwd/kasten-gitops.git
    targetRevision: main
    path: argocd/MCM/clusters/aks-primary
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    - group: ""
      kind: Secret
      namespace: kasten-io-mc
      name: mc-join-token
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
